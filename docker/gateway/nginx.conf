# routes the frontend's calls to the four services by path prefix. /internal/ is never routed, those endpoints are
# only for the services to call each other inside the compose network
upstream notification-service { server notification-service:8081; }
upstream user-service         { server user-service:8082; }
upstream booking-service      { server booking-service:8083; }
upstream document-service     { server document-service:8084; }

server {
    listen 8080;

    client_max_body_size 50m; # kyc documents, certificates and profile pictures

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /internal/ {
        return 404;
    }

    # the audit log is in notification-service. An exact match, so only the path /admin/logs (with any query string)
    # goes there and every other /admin/ path stays with user-service below
    location = /admin/logs { proxy_pass http://notification-service; }

    # server-sent events: no buffering, and the connection stays open for a long time
    location /notifications/stream {
        proxy_pass http://notification-service;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /notifications/ { proxy_pass http://notification-service; }

    location /auth/                     { proxy_pass http://user-service; }
    location /profile/                  { proxy_pass http://user-service; }
    location /advisors                  { proxy_pass http://user-service; }
    location /admin/                    { proxy_pass http://user-service; }
    location /uploads/profile_pictures/ { proxy_pass http://user-service; }

    location /appointments/  { proxy_pass http://booking-service; }
    location /slots          { proxy_pass http://booking-service; }
    location /service-types  { proxy_pass http://booking-service; }

    location /kyc                  { proxy_pass http://document-service; }
    location /advisor-applications { proxy_pass http://document-service; }

    location / {
        return 404;
    }
}
