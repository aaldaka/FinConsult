# Test-only settings, loaded by @TestPropertySource(locations = "classpath:test.properties").
#
# These tests run on the main app's test database, finconsult_test, shared with the main app's own tests.
# This service does not create that schema: the main app's test suite builds it (run ./mvnw test in the
# project root first), so these tests ASSUME it already exists. ddl-auto=validate only checks that the
# notifications table matches this service's entity, it never creates or changes anything.
# The notifications table has foreign keys to users and appointments, so the tests look up real users in
# that database instead of inventing ids, and each test deletes only the notifications it created.
#
# Every value can be overridden with an environment variable; the defaults are dummy values, never real secrets.

spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/finconsult_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate

# Base64 of "finconsult-test-only-jwt-signing-key-not-a-real-secret" (54 bytes decoded)
jwt.secret=${JWT_SECRET:ZmluY29uc3VsdC10ZXN0LW9ubHktand0LXNpZ25pbmcta2V5LW5vdC1hLXJlYWwtc2VjcmV0}

# kafka: no broker in these tests. The address is a dummy and the listener does not start, so nothing connects;
# the embedded kafka test overrides both
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false

# mail: dummy values so the mail sender can be created; nothing is sent, the email tests mock JavaMailSender and the
# listener does not start
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test-sender@example.com
# there is no mail server behind the dummy host, so the mail health check is off (it would report the service down)
management.health.mail.enabled=false
