# Test-only settings, loaded by @TestPropertySource(locations = "classpath:test.properties").
#
# These tests run on the main app's test database, finconsult_test, shared with the main app's own tests.
# This service does not create that schema: the main app's test suite builds it (run ./mvnw test in the
# project root first), so these tests ASSUME it already exists. ddl-auto=validate only checks that the
# users, profiles, advisors and token tables match this service's entities, it never creates or changes anything.
#
# Every value can be overridden with an environment variable; the defaults are dummy values, never real secrets.

spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/finconsult_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate

# Base64 of "finconsult-test-only-jwt-signing-key-not-a-real-secret" (54 bytes decoded)
jwt.secret=${JWT_SECRET:ZmluY29uc3VsdC10ZXN0LW9ubHktand0LXNpZ25pbmcta2V5LW5vdC1hLXJlYWwtc2VjcmV0}
jwt.expirationMs=3600000

# the mail sender is created from these, nothing is ever sent: the auth tests mock EmailService
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_PASSWORD:unused}

# the key the /internal/** tests send in X-Internal-Key, a dummy value
internal.api-key=test-internal-key-not-a-real-secret

# kafka: a dummy address, nothing here reaches a broker. The producer only connects on its first send, and the
# tests that audit or send email events mock AuditRecorder, EmailPublisher or the KafkaTemplate
spring.kafka.bootstrap-servers=localhost:9092
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
