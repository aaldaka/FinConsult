# Test-only settings, loaded by @TestPropertySource(locations = "classpath:test.properties").
#
# These tests run on the main app's test database, finconsult_test, shared with the main app's own tests.
# This service does not create that schema: the main app's test suite builds it (run ./mvnw test in the
# project root first), so these tests ASSUME it already exists. ddl-auto=validate only checks that the
# appointments, availability_slots and service_types tables match this service's entities, it never
# creates or changes anything. The tests only read, they create no data.
#
# Every value can be overridden with an environment variable; the defaults are dummy values, never real secrets.

spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/finconsult_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate

# Base64 of "finconsult-test-only-jwt-signing-key-not-a-real-secret" (54 bytes decoded)
jwt.secret=${JWT_SECRET:ZmluY29uc3VsdC10ZXN0LW9ubHktand0LXNpZ25pbmcta2V5LW5vdC1hLXJlYWwtc2VjcmV0}

# where the user service is and the key its /internal endpoints need, dummy values: the tests mock the clients
user-service.url=http://localhost:8082
internal.api-key=test-internal-key-not-a-real-secret

# kafka: a dummy address, nothing here reaches a broker. The producer only connects on its first send, the Spring
# tests that book, cancel or mark no-shows mock NotificationPublisher and AuditRecorder, and the event tests use a
# mocked KafkaTemplate
spring.kafka.bootstrap-servers=localhost:9092
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
