# every value comes from the root .env (copy .env.example to .env and fill it in). Only the gateway, the frontend and
# postgres publish ports to the host; the four services are reachable only inside the compose network

x-database: &database
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finconsult}
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  JWT_SECRET: ${JWT_SECRET}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finconsult}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB:-finconsult}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  notification-service:
    build: ./notification-service
    environment:
      <<: *database
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  user-service:
    build: ./user-service
    environment:
      <<: *database
      SERVER_PORT: 8082
      JWT_EXPIRATIONMS: ${JWT_EXPIRATION_MS:-3600000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BOOKING_SERVICE_URL: http://booking-service:8083
      APP_UPLOAD_DIR: /app/uploads
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE:-10MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE:-30MB}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
    volumes:
      - user-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  booking-service:
    build: ./booking-service
    environment:
      <<: *database
      SERVER_PORT: 8083
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      USER_SERVICE_URL: http://user-service:8082
      DOCUMENT_SERVICE_URL: http://document-service:8084
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  document-service:
    build: ./document-service
    environment:
      <<: *database
      SERVER_PORT: 8084
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      USER_SERVICE_URL: http://user-service:8082
      APP_UPLOAD_DIR: /app/uploads
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE:-10MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE:-30MB}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      KYC_CHECK_DELAY_MS: ${KYC_CHECK_DELAY_MS:-0}
    volumes:
      - document-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  gateway:
    image: nginx:alpine
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - notification-service
      - user-service
      - booking-service
      - document-service
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - gateway
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  user-uploads:
  document-uploads:
